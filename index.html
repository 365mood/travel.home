<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木德去旅遊 | 365Mood Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Noto+Serif+TC:wght@300;600&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ins-white: #FFFFFF;
            --ins-cream: #FAF9F6;
            --ins-sand-light: #F2F0EA;
            --ins-border: #E5E1D8;
            --ins-text: #454545;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--ins-cream);
            color: var(--ins-text);
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            letter-spacing: 0.03em;
            /* Fixed mobile width, centered on desktop */
            width: 390px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* desktop wrapper bg */
        html {
            background: #e8e5df;
        }

        .serif-italic { font-family: 'Bodoni Moda', serif; font-style: italic; }
        .serif-bold   { font-family: 'Noto Serif TC', serif; font-weight: 600; }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(250, 249, 246, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--ins-border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.15em;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 300;
            color: var(--ins-text);
            text-decoration: none;
            opacity: 0.7;
        }

        .nav-links a:active { opacity: 0.3; }

        /* MAIN */
        main {
            padding: 24px 16px 40px;
        }

        /* ICON GRID — fixed 4 cols */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 32px;
        }

        .category-card {
            background: var(--ins-white);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 14px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: var(--ins-text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: background 0.2s;
        }

        .category-card:active {
            background: var(--ins-sand-light);
        }

        .card-icon { font-size: 22px; line-height: 1; }

        .card-label {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.3;
        }

        /* DESTINATIONS */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--ins-border);
            padding-bottom: 12px;
            margin-bottom: 0;
        }

        .section-header h2 {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: 20px;
        }

        .section-header span {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #aaa;
        }

        .dest-line {
            border-bottom: 1px solid var(--ins-border);
            padding: 16px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--ins-text);
            transition: padding-left 0.2s, color 0.2s;
        }

        .dest-line:active {
            padding-left: 12px;
            color: #A39684;
        }

        .dest-name {
            font-size: 12px;
            letter-spacing: 0.2em;
        }

        .dest-explore {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: 10px;
            color: #ccc;
        }

        /* FOOTER */
        footer {
            background: var(--ins-white);
            border-top: 1px solid var(--ins-border);
            padding: 32px 20px 48px;
            text-align: center;
        }

        .footer-title {
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .footer-links a {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #aaa;
            text-decoration: none;
        }

        .footer-links a:active { color: #454545; }

        .footer-copy {
            font-size: 7px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #ddd;
        }
    </style>
</head>
