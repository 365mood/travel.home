    <script>
        window.onload = () => lucide.createIcons();
        
        function switchTab(tab) {
            const tabs = ['trip', 'kkday', 'rewards'];
            const indicator = document.getElementById('tab-indicator');
            const index = tabs.indexOf(tab);
            
            indicator.style.transform = `translateX(${index * 100}%)`;

            tabs.forEach(t => {
                const el = document.getElementById(`${t}-links`);
                const btn = document.getElementById(`btn-${t}`);
                if (t === tab) {
                    el.classList.remove('hidden');
                    btn.classList.replace('text-neutral-400', 'text-neutral-800');
                } else {
                    el.classList.add('hidden');
                    btn.classList.replace('text-neutral-800', 'text-neutral-400');
                }
            });
        }

        function copyPromoCode(code) {
            navigator.clipboard.writeText(code);
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = `已複製: ${code}`;
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2000);
        }
    </script>
